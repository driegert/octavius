<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172033">
<title>Octavius</title>
<link rel="icon" type="image/png" href="/static/octavius-dapper_cyber_punk.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Spline+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/octavius.css?v=20261030">
<link rel="stylesheet" href="/static/index.css?v=20261030">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="/static/app-common.js?v=20261030"></script>
</head>
<body>

<div class="shell" id="shell">

  <!-- ===== Side rail: conversations + settings ===== -->
  <aside class="rail" id="rail" aria-label="Conversations and settings">
    <header class="rail-head">
      <a class="wordmark" href="/">Octavius</a>
      <button class="icon-btn only-narrow" id="rail-close" aria-label="Close panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <button class="new-conv" id="reset-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New conversation
    </button>

    <div class="rail-tabs" role="tablist" aria-label="Side panel">
      <button role="tab" class="rail-tab" id="tab-history" aria-selected="true" aria-controls="pane-history">Conversations</button>
      <button role="tab" class="rail-tab" id="tab-settings" aria-selected="false" aria-controls="pane-settings">Settings</button>
    </div>

    <section class="rail-pane" id="pane-history" role="tabpanel" aria-labelledby="tab-history">
      <div class="agents" id="agents-section" hidden>
        <h3 class="pane-heading">Working in the background</h3>
        <div id="agents-list"></div>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>

    <section class="rail-pane" id="pane-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="field">
        <label class="field-label" for="voice-select">Voice</label>
        <select id="voice-select"></select>
      </div>

      <div class="field">
        <div class="field-row">
          <label class="field-label" for="speed-slider">Speaking speed</label>
          <output id="speed-value" for="speed-slider">1.4x</output>
        </div>
        <input type="range" id="speed-slider" min="1.0" max="2.0" step="0.1" value="1.4">
      </div>

      <fieldset class="field">
        <legend class="field-label">Talk mode</legend>
        <div class="segmented" id="talk-mode-group">
          <label><input type="radio" name="talk-mode" value="hold" checked><span>Hold</span></label>
          <label><input type="radio" name="talk-mode" value="toggle"><span>Tap</span></label>
          <label><input type="radio" name="talk-mode" value="continuous"><span>Hands-free</span></label>
        </div>
        <p class="field-help" id="talk-mode-help"></p>
      </fieldset>

      <div class="field switches">
        <label class="switch"><input type="checkbox" id="trim-cb" checked><span class="switch-track"></span>Trim long pauses</label>
        <label class="switch"><input type="checkbox" id="normalize-cb" checked><span class="switch-track"></span>Even out volume</label>
        <label class="switch"><input type="checkbox" id="proactive-speak-cb"><span class="switch-track"></span>Speak background results when ready</label>
      </div>

      <div class="field keys">
        <span class="field-label">Keyboard</span>
        <dl>
          <dt><kbd>Space</kbd></dt><dd>Talk (outside the text box)</dd>
          <dt><kbd>/</kbd></dt><dd>Jump to the text box</dd>
          <dt><kbd>Esc</kbd></dt><dd>Stop speaking</dd>
        </dl>
      </div>
    </section>

    <footer class="rail-foot">
      <a class="rail-link" id="inbox-link" href="/inbox">Inbox<span id="inbox-badge" class="dot" hidden></span></a>
      <a class="rail-link" href="/reader">Reader</a>
    </footer>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <!-- ===== Stage: transcript + dock ===== -->
  <main class="stage">
    <header class="stage-head">
      <button class="icon-btn only-narrow" id="rail-open" aria-label="Open conversations and settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <h1 class="stage-title" id="conv-title">New conversation</h1>
      <span class="conn" id="conn-state" data-state="connecting">Connecting</span>
    </header>

    <div class="transcript" id="transcript" aria-live="polite">
      <div class="column" id="transcript-column">
        <div class="empty" id="empty-state">
          <p class="empty-greeting" id="empty-greeting">Hello, Dave.</p>
          <p class="empty-hint" id="empty-hint">Hold Space to talk, or write below.</p>
        </div>
      </div>
    </div>

    <footer class="dock">
      <div class="dock-inner">
        <button class="orb" id="talk-btn" disabled aria-label="Hold to talk">
          <canvas id="orb-canvas" aria-hidden="true"></canvas>
        </button>

        <div class="dock-main">
          <div class="dock-status">
            <span class="status" id="status" role="status">Connecting…</span>
            <span class="hint" id="talk-hint"></span>
            <button class="stop" id="stop-btn" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
              Stop speaking
            </button>
          </div>
          <form class="composer" id="text-form" autocomplete="off">
            <textarea id="text-input" rows="1" placeholder="Write to Octavius" aria-label="Message"></textarea>
            <button type="submit" class="send" id="text-send" disabled aria-label="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
            </button>
          </form>
        </div>

        <div class="dock-toggles">
          <button class="toggle" id="stt-toggle" aria-pressed="true" title="Microphone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/><path class="slash" d="M4 4l16 16"/>
            </svg>
            <span class="toggle-label">Mic</span>
          </button>
          <button class="toggle" id="tts-toggle" aria-pressed="true" title="Speak replies aloud">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="slash" d="M4 4l16 16"/>
            </svg>
            <span class="toggle-label">Voice</span>
          </button>
        </div>
      </div>
    </footer>
  </main>
</div>

<script src="/static/index-audio.js?v=20261030"></script>
<script src="/static/index-orb.js?v=20261030"></script>
<script src="/static/index-app.js?v=20261030"></script>
</body>
</html>
