<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172033">
<title>Octavius Reader</title>
<link rel="icon" type="image/png" href="/static/octavius-dapper_cyber_punk.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Spline+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/octavius.css?v=20261030">
<link rel="stylesheet" href="/static/reader.css?v=20261030">
<script src="/static/app-common.js?v=20261030"></script>
</head>
<body>

<div class="shell" id="shell">

  <!-- ===== Rail: library ===== -->
  <aside class="rail" id="rail" aria-label="Documents">
    <header class="rail-head">
      <div class="rail-brand">
        <a class="wordmark" href="/">Octavius</a>
        <span class="rail-sub">Reader</span>
      </div>
      <button class="icon-btn only-narrow" id="rail-close" aria-label="Close documents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <section class="add" aria-label="Add a document">
      <form class="add-row" id="ingest-form" autocomplete="off">
        <input type="text" id="ingest-input" placeholder="Add a file path or URL" aria-label="File path or URL">
        <button type="submit" class="add-go" id="ingest-btn" aria-label="Add document">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>
      <button class="link-btn" id="paste-toggle" aria-expanded="false" aria-controls="paste-bar">Paste text instead</button>
      <div class="paste" id="paste-bar" hidden>
        <textarea id="paste-input" placeholder="Paste or type text to read aloud" aria-label="Text to read"></textarea>
        <input type="text" id="paste-title" placeholder="Title (optional)" aria-label="Title">
        <div class="paste-actions">
          <span class="paste-key"><kbd>Ctrl</kbd> <kbd>Enter</kbd> adds it</span>
          <button class="btn" id="paste-cancel">Cancel</button>
          <button class="btn primary" id="paste-submit">Add text</button>
        </div>
      </div>
      <p class="add-msg" id="add-msg" role="status"></p>
    </section>

    <div class="find">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <input type="search" id="doc-search" placeholder="Find a document" aria-label="Find a document">
        <kbd class="search-key">/</kbd>
      </div>
      <div class="chips" id="status-filter" role="radiogroup" aria-label="Show">
        <button role="radio" class="chip" data-filter="all" aria-checked="true">All</button>
        <button role="radio" class="chip" data-filter="ready" aria-checked="false">Ready</button>
        <button role="radio" class="chip" data-filter="processing" aria-checked="false">Converting</button>
        <button role="radio" class="chip" data-filter="failed" aria-checked="false">Failed</button>
      </div>
    </div>

    <div class="doc-list" id="doc-list" role="list"></div>

    <footer class="rail-foot">
      <a class="rail-link" href="/">Talk</a>
      <a class="rail-link" href="/inbox">Inbox</a>
    </footer>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <!-- ===== Stage ===== -->
  <main class="stage">
    <header class="stage-head">
      <button class="icon-btn only-narrow" id="rail-open" aria-label="Open documents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <h1 class="stage-title" id="player-title">Reader</h1>
      <button class="btn" id="player-edit" hidden>Edit</button>
      <span class="conn" id="conn-state" data-state="connecting">Connecting</span>
    </header>

    <!-- Edit panel: rename / append / replace -->
    <div class="edit-wrap" id="edit-bar" hidden>
      <div class="edit">
        <div class="edit-grid">
          <label class="field-label" for="edit-title">Title</label>
          <input type="text" id="edit-title" placeholder="Title">
          <label class="field-label" for="edit-append">Add text</label>
          <textarea id="edit-append" placeholder="Paste the rest of the document here, for example the part behind a sign-in wall"></textarea>
        </div>
        <label class="switch"><input type="checkbox" id="edit-replace"><span class="switch-track"></span>Replace the whole document with this text</label>
        <p class="edit-hint" id="edit-hint"></p>
        <p class="edit-error" id="edit-error" role="alert"></p>
        <div class="edit-actions">
          <button class="btn" id="edit-cancel">Cancel</button>
          <button class="btn primary" id="edit-save">Save</button>
        </div>
      </div>
    </div>

    <div class="page" id="page">
      <div class="column" id="column">
        <div class="empty" id="empty-state">
          <p class="empty-greeting">Pick something to read.</p>
          <p class="empty-hint" id="empty-hint">Choose a document on the left, or add a file path, a URL or pasted text.</p>
        </div>
        <div class="doc-state" id="doc-state" hidden></div>
        <div class="notice" id="read-along" role="status" hidden></div>
        <article class="text" id="sections" aria-label="Document text"></article>
      </div>
    </div>

    <button class="follow" id="follow-btn" hidden>Back to the current sentence</button>

    <!-- Transport -->
    <footer class="transport" id="transport">
      <div class="transport-inner">
        <div class="transport-keys">
          <button class="icon-btn" id="skip-back" title="Previous section (Shift+←)" aria-label="Previous section">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h2v12H7zM20 6v12l-9-6z"/></svg>
          </button>
          <button class="icon-btn" id="step-back" title="Previous sentence (←)" aria-label="Previous sentence">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button class="orb" id="play-pause-btn" disabled aria-label="Play" title="Play (Space)">
            <canvas id="orb-canvas" aria-hidden="true"></canvas>
            <svg class="glyph play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.2v11.6a.6.6 0 0 0 .9.5l9.2-5.8a.6.6 0 0 0 0-1L9.4 5.7a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg>
            <svg class="glyph pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="6" width="3.6" height="12" rx="1" fill="currentColor"/><rect x="13.4" y="6" width="3.6" height="12" rx="1" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn" id="step-fwd" title="Next sentence (→)" aria-label="Next sentence">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="icon-btn" id="skip-fwd" title="Next section (Shift+→)" aria-label="Next section">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 6h2v12h-2zM4 6v12l9-6z"/></svg>
          </button>
        </div>

        <div class="transport-main">
          <div class="transport-status">
            <span class="status" id="status">No document open</span>
            <span class="where" id="where"></span>
            <span class="count"><span id="progress-current">0</span> of <span id="progress-total">0</span></span>
          </div>
          <input type="range" id="progress-bar" min="0" max="0" value="0" aria-label="Position in document">
        </div>

        <div class="transport-opts">
          <label class="opt">
            <span class="opt-label">Speed <output id="reader-speed-val">1.4x</output></span>
            <input type="range" id="reader-speed" min="1.0" max="2.0" step="0.1" value="1.4" aria-label="Speaking speed">
          </label>
          <label class="opt">
            <span class="opt-label">Voice</span>
            <select id="reader-voice" aria-label="Voice"></select>
          </label>
        </div>
      </div>
    </footer>
  </main>
</div>

<script src="/static/index-orb.js?v=20261030"></script>
<script src="/static/reader-app.js?v=20261030"></script>
</body>
</html>
